<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Care Group | Structural Intelligence for NDIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              royal: { 
                950: '#01040f', 
                900: '#020617', 
                800: '#0f172a', 
                700: '#1e293b',
                600: '#334155'
              },
              neon: { 
                purple: '#d946ef', 
                blue: '#06b6d4',
                green: '#10b981',
                red: '#ef4444'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif']
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
              'spin-reverse-slow': 'spin-reverse 15s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'gradient-x': 'gradient-x 5s ease infinite',
              'scan': 'scan 3s ease-in-out infinite',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'glitch': 'glitch 1s linear infinite',
              'marquee': 'marquee 40s linear infinite',
            },
            keyframes: {
              'spin-reverse': {
                from: { transform: 'rotate(360deg)' },
                to: { transform: 'rotate(0deg)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: 1, boxShadow: '0 0 20px rgba(217,70,239,0.3)' },
                '50%': { opacity: 0.7, boxShadow: '0 0 40px rgba(217,70,239,0.6)' }
              },
              'gradient-x': {
                '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                '50%': { 'background-size': '200% 200%', 'background-position': 'right center' }
              },
              scan: {
                '0%, 100%': { top: '0%' },
                '50%': { top: '100%' },
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translate(-50%, 20px)' },
                '100%': { opacity: '1', transform: 'translate(-50%, -50%)' },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body { background-color: #01040f; color: #f8fafc; margin: 0; overflow-x: hidden; }
      .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
      .neon-border-purple { border: 1px solid rgba(217,70,239,0.3); box-shadow: 0 0 20px rgba(217,70,239,0.1); }
      .neon-border-blue { border: 1px solid rgba(6,182,212,0.3); box-shadow: 0 0 20px rgba(6,182,212,0.1); }
      .glow-text-purple { text-shadow: 0 0 10px rgba(217,70,239,0.5); }
      .glow-text-blue { text-shadow: 0 0 10px rgba(6,182,212,0.5); }
      
      .bg-noise::after {
        content: "";
        position: fixed;
        top: -150%;
        left: -150%;
        width: 300%;
        height: 300%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.05;
        pointer-events: none;
        z-index: 9999;
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #01040f; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #d946ef; }
      
      .orbital-border {
        border: 1px solid rgba(6,182,212,0.2);
        border-radius: 50%;
        position: relative;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
      }
      .orbital-border::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(45deg, #06b6d4, #d946ef, #06b6d4);
        background-size: 200% 200%;
        animation: gradient-x 3s linear infinite;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }

      .orbital-tile {
        position: relative;
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 2.5rem;
        overflow: hidden;
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .orbital-tile::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.08), transparent 40%);
        pointer-events: none;
      }
      .orbital-tile:hover {
        border-color: rgba(6, 182, 212, 0.3);
        transform: translateY(-8px) scale(1.01);
        box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      }
      .orbital-content {
        position: relative;
        z-index: 10;
      }

      .slim-orbital-btn {
        position: relative;
        background: #020617;
        border: 1px solid rgba(6, 182, 212, 0.4);
        border-radius: 1.25rem;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slim-orbital-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, rgba(6, 182, 212, 0.2), rgba(217, 70, 239, 0.2));
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .slim-orbital-btn:hover {
        border-color: #06b6d4;
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
        transform: translateY(-2px);
      }
      .slim-orbital-btn:hover::before {
        opacity: 1;
      }
      
      .text-spotlight {
        background: linear-gradient(135deg, #fff 0%, #94a3b8 50%, #475569 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% 200%;
        animation: gradient-x 8s ease infinite;
      }

      .cyber-grid {
        background-image: linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .mask-radial {
        mask-image: radial-gradient(circle at center, black, transparent 80%);
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.468.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "jszip": "https://esm.sh/jszip@^3.10.1"
  }
}
</script>
</head>
<body class="antialiased selection:bg-neon-blue/30 bg-noise cyber-grid">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
