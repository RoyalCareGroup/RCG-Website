    <style>
      body { background-color: #020817; color: #f1f5f9; margin: 0; overflow-x: hidden; }
      
      /* HIGH DEFINITION SURFACES */
      .glass { 
        background: rgba(15, 23, 42, 0.85); 
        backdrop-filter: blur(20px); 
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      
      .bg-noise::after {
        content: ""; position: fixed; top: -150%; left: -150%; width: 300%; height: 300%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg"); opacity: 0.03; pointer-events: none; z-index: 9999;
      }

      /* ARCHITECTURAL MENU BORDER: 10px Rounded + Tracing Light */
      .orbital-border {
        border: 1px solid rgba(255, 255, 255, 0.15); 
        border-radius: 10px; 
        position: relative;
        background: #0f172a; 
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      }
      .orbital-border::before {
        content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, #06b6d4, #d946ef, transparent);
        animation: tracing-light 3s linear infinite;
      }
      .orbital-border::after {
        content: ""; position: absolute; bottom: 0; right: -100%; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, #d946ef, #06b6d4, transparent);
        animation: tracing-light 3s linear infinite;
        animation-delay: 1.5s;
      }

      .orbital-tile {
        position: relative; 
        background: rgba(15, 23, 42, 0.7); 
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 2rem; 
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
      }
      .orbital-tile:hover {
        transform: translateY(-10px); 
        border-color: rgba(6, 182, 212, 0.5);
        background: rgba(30, 41, 59, 0.85); 
        box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8), 0 0 30px rgba(6, 182, 212, 0.1);
      }

      /* NEON BUTTON SYSTEM */
      .slim-orbital-btn {
        position: relative; 
        background: #0f172a; 
        border: 1px solid rgba(6, 182, 212, 0.3);
        border-radius: 12px; 
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        z-index: 1;
      }
      .slim-orbital-btn::before {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(45deg, #06b6d422, #d946ef22);
        opacity: 0; transition: opacity 0.4s ease; z-index: -1;
      }
      .slim-orbital-btn:hover {
        border-color: #06b6d4; 
        background: #1e293b;
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.4), 0 10px 40px rgba(0,0,0,0.5);
      }
      .slim-orbital-btn:hover::before {
        opacity: 1;
      }

      /* Apply subtle neon to ALL theme buttons */
      button:not(.orbital-border), a.px-12, a.px-14, a.px-16 {
        position: relative;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .bg-neon-purple:hover {
        box-shadow: 0 0 30px rgba(217, 70, 239, 0.5);
        border: 1px solid rgba(255,255,255,0.4);
      }
      
      .bg-white:hover {
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
      }

      .cyber-grid {
        background-image: linear-gradient(rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* Scrollbar Definition */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #020817; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
